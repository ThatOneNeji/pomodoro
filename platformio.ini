; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the firmware only; the native env is for `pio test -e native`.
default_envs = esp32dev

[env]
platform = espressif32
; Writes src/version_generated.h (git describe + build time) before each build; see the script.
extra_scripts = pre:scripts/fw_version.py
upload_port = /dev/ttyUSB0
monitor_speed = 115200
lib_deps =
        zinggjm/GxEPD2@^1.6.9
        madhephaestus/ESP32Encoder@^0.12.0
        makuna/NeoPixelBus@^2.8.4
        ESP32Async/AsyncTCP@^3.3.2
        ESP32Async/ESPAsyncWebServer@^3.7.0
        bblanchon/ArduinoJson@^7.2.1
        knolleary/PubSubClient@^2.8

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wunused
    -Wunused-function
    -Wunused-variable
    -Wunused-parameter
    -Wunused-value
    -Wunused-label
    ; Gates ESP_LOGx()/log_x() calls: 0=None 1=Error 2=Warn 3=Info 4=Debug 5=Verbose.
    ; Without this, ESP_LOGx compiles to a no-op and prints nothing at all.
    -DCORE_DEBUG_LEVEL=3

[env:esp32dev]
board = esp32dev
framework = arduino
build_flags  =
    ${env.build_flags}
; Single 2MB app partition (no OTA, not needed here) + ~1.9MB data partition for the
; upcoming data/ static-file webserver work. The default dual-OTA-slot table caps the app
; at 1.31MB, which the WiFi/webserver stack alone already exceeds.
board_build.partitions = no_ota.csv
board_build.filesystem = littlefs

; Host unit tests: `pio test -e native` (see test/README.md). Builds the timer and its helpers
; for the laptop, with stand-ins for the hardware libraries from test/fakes/.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I test/fakes
build_src_filter =
    -<*>
    +<timer.cpp>
    +<states/>
    +<menu.cpp>
    +<checkbox.cpp>
    +<messages.cpp>
    +<gfx_utils.cpp>
    +<statistics.cpp>
    +<icon_provider.cpp>
    +<icons/>
    +<../test/fakes/>
