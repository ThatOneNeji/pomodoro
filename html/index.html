<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ESP32 Pomodoro</title>
        <link rel="icon" href="favicon.ico" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="app-header">
            <span class="app-title">Pomodoro</span>
            <div class="header-actions">
                <a class="icon-link" href="status.html" aria-label="Device status" title="Device status">
                    <!-- Bootstrap Icons "info-circle" (MIT) -->
                    <svg class="icon icon-filled" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"></path>
                        <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0"></path>
                    </svg>
                </a>
                <a class="icon-link" href="settings.html" aria-label="Settings" title="Settings">
                    <svg class="icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </a>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
                    <svg class="icon icon-sun" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                    </svg>
                    <svg class="icon icon-moon" viewBox="0 0 24 24">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main class="timer-card">
            <nav class="mode-tabs" id="preset-tabs" role="tablist" aria-label="Presets"></nav>

            <p class="phase-label" id="phase-label">Connecting…</p>
            <div class="time-display" id="time-display">--:--</div>
            <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>

            <div class="controls">
                <button id="primary-btn" class="btn-primary" type="button" disabled>Start</button>
            </div>
            <div class="controls secondary-controls">
                <button id="restart-btn" class="btn-secondary btn-labeled" type="button" hidden>Restart</button>
                <button id="break-btn" class="btn-secondary btn-labeled" type="button" hidden>Break now</button>
                <button id="stop-btn" class="btn-secondary btn-labeled" type="button" hidden>Stop</button>
            </div>

            <p class="session-count" id="session-count"></p>
            <p class="connection-status" id="connection-status" role="status"></p>
        </main>
        <footer class="app-footer">
            <p>Pomodoro running on ESP32</p>
        </footer>

        <script>
            (function () {
                'use strict';

                // ---- Theme ----
                var root = document.documentElement;
                var themeToggle = document.getElementById('theme-toggle');
                var storedTheme = localStorage.getItem('theme');
                if (storedTheme === 'light' || storedTheme === 'dark') {
                    root.setAttribute('data-theme', storedTheme);
                }

                function currentEffectiveTheme() {
                    var explicit = root.getAttribute('data-theme');
                    if (explicit) return explicit;
                    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }

                themeToggle.addEventListener('click', function () {
                    var next = currentEffectiveTheme() === 'dark' ? 'light' : 'dark';
                    root.setAttribute('data-theme', next);
                    localStorage.setItem('theme', next);
                });

                // ---- Connection ----
                // Served by the device, the page talks to its own host. During local development
                // (e.g. VS Code Live Server on 127.0.0.1) there is no device there: open the page
                // once with ?device=<device-ip>, and that address is remembered in this browser.
                // ?device= always takes priority, so it also works for pointing at another unit.
                var params = new URLSearchParams(location.search);
                var isLocalDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
                var deviceHost = params.get('device');
                try {
                    if (deviceHost) {
                        localStorage.setItem('device', deviceHost);
                    } else if (isLocalDev) {
                        deviceHost = localStorage.getItem('device');
                    }
                } catch (e) {
                    // Storage blocked (e.g. private mode): ?device= still works for this load.
                }
                deviceHost = deviceHost || location.hostname;
                var gateway = 'ws://' + deviceHost + '/ws';
                var RECONNECT_DELAY_MAX = 30000;
                // A command that isn't valid in the current state is silently ignored by the
                // device (see websocket.md), so give up waiting for its status change after this.
                var COMMAND_TIMEOUT = 6000;

                var websocket = null;
                var reconnectDelay = 1000;
                var connected = false;

                // ---- State (from the device; see websocket.md) ----
                var presets = [];
                var status = null;
                var statusReceivedAt = 0; // Date.now() when `status` arrived, for the remainingMs fallback
                var clockOffset = 0; // device clock minus browser clock, in ms
                var pending = null; // {state, presetIndex, endsAt, timer} while waiting for a command to take effect
                var notice = '';
                var switchedOff = false; // the device announced a shutdown; cleared when it's back

                var presetTabs = document.getElementById('preset-tabs');
                var phaseLabel = document.getElementById('phase-label');
                var timeDisplay = document.getElementById('time-display');
                var progressBar = document.getElementById('progress-bar');
                var primaryBtn = document.getElementById('primary-btn');
                var restartBtn = document.getElementById('restart-btn');
                var breakBtn = document.getElementById('break-btn');
                var stopBtn = document.getElementById('stop-btn');
                var sessionCount = document.getElementById('session-count');
                var connectionStatus = document.getElementById('connection-status');

                // Keep ?device= when moving between pages.
                document.querySelectorAll('a.icon-link').forEach(function (link) {
                    link.search = location.search;
                });

                // Per-state UI: phase label, primary action, which secondary actions are offered, and
                // the accent colour. Mirrors the "valid commands per state" table in websocket.md.
                var STATES = {
                    SelectingPreset: { phase: 'Ready', primary: ['Start', 'start'], secondary: [], mode: 'work' },
                    Running: { phase: 'Working', primary: ['Pause', 'pause'], secondary: ['restart', 'break', 'stop'], mode: 'work' },
                    UserInitiatedPause: { phase: 'Paused', primary: ['Resume', 'resume'], secondary: ['restart', 'break', 'stop'], mode: 'work' },
                    WaitingConfirmStartOfBreak: { phase: 'Time for a break', primary: ['Start break', 'break'], secondary: [], mode: 'break' },
                    RunningBreak: { phase: 'Break', primary: ['Pause', 'pause'], secondary: ['stop'], mode: 'break' },
                    UserInitiatedBreakPause: { phase: 'Break paused', primary: ['Resume', 'resume'], secondary: ['stop'], mode: 'break' },
                    WaitingConfirmEndOfBreak: { phase: 'Break over', primary: ['Start next', 'start'], secondary: ['stop'], mode: 'break' }
                };

                function send(command) {
                    if (!connected) return;
                    websocket.send(JSON.stringify(command));
                    clearTimeout(pending && pending.timer);
                    pending = {
                        state: status && status.state,
                        presetIndex: status && status.presetIndex,
                        endsAt: status && status.endsAt,
                        timer: setTimeout(function () {
                            pending = null;
                            notice = 'The device didn’t respond to that.';
                            render();
                        }, COMMAND_TIMEOUT)
                    };
                    notice = '';
                    render();
                }

                function remainingMs() {
                    if (!status) return 0;
                    if (status.endsAt !== null && status.endsAt !== undefined) {
                        return Math.max(0, status.endsAt - (Date.now() + clockOffset));
                    }
                    // Paused/idle, or the device clock isn't synced yet: count down locally from the
                    // last report only while actually running, so a dropped connection keeps going.
                    var running = status.state === 'Running' || status.state === 'RunningBreak';
                    var since = running ? Date.now() - statusReceivedAt : 0;
                    return Math.max(0, status.remainingMs - since);
                }

                function formatTime(ms) {
                    var totalSeconds = Math.ceil(ms / 1000);
                    var m = Math.floor(totalSeconds / 60);
                    var s = totalSeconds % 60;
                    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
                }

                function renderTabs() {
                    presetTabs.textContent = '';
                    presets.forEach(function (preset, index) {
                        var tab = document.createElement('button');
                        tab.type = 'button';
                        tab.className = 'mode-tab';
                        tab.setAttribute('role', 'tab');
                        tab.textContent = preset.name;
                        tab.addEventListener('click', function () {
                            if (status && index === status.presetIndex) return;
                            send({ cmd: 'select', preset: index });
                        });
                        presetTabs.appendChild(tab);
                    });
                }

                function renderTime() {
                    if (!status) return;
                    var ms;
                    var duration = status.durationMs;
                    var timeUp = status.state === 'WaitingConfirmStartOfBreak' || status.state === 'WaitingConfirmEndOfBreak';
                    if (status.state === 'SelectingPreset') {
                        // Idle: preview the selected preset's work length.
                        var preset = presets[status.presetIndex];
                        ms = preset ? preset.durationMs : 0;
                        duration = 0;
                    } else {
                        ms = remainingMs();
                    }
                    timeDisplay.textContent = formatTime(ms);
                    // The device reports no duration once an interval has run out; show it as complete.
                    progressBar.style.width = timeUp ? '100%' : duration > 0 ? (100 * (1 - ms / duration)).toFixed(2) + '%' : '0%';
                    document.title = status.state === 'SelectingPreset' ? 'Pomodoro' : formatTime(ms) + ' · ' + status.presetName;
                }

                function render() {
                    var ui = status && STATES[status.state];
                    var busy = !connected || !status || pending !== null;

                    Array.prototype.forEach.call(presetTabs.children, function (tab, index) {
                        var active = status && index === status.presetIndex;
                        tab.classList.toggle('active', !!active);
                        tab.setAttribute('aria-selected', active ? 'true' : 'false');
                        // Presets can only be changed while idle.
                        tab.disabled = busy || !status || status.state !== 'SelectingPreset';
                    });

                    if (ui) {
                        var phase = ui.phase;
                        if (ui.mode === 'break' && status.state !== 'WaitingConfirmEndOfBreak') {
                            phase = (status.isLongBreak ? 'Long ' : 'Short ') + phase.toLowerCase();
                        }
                        phaseLabel.textContent = phase;
                        root.style.setProperty('--mode-color', ui.mode === 'work' ? 'var(--accent)' : status.isLongBreak ? 'var(--accent-long-break)' : 'var(--accent-short-break)');

                        primaryBtn.textContent = ui.primary[0];
                        primaryBtn.disabled = busy;
                        restartBtn.hidden = ui.secondary.indexOf('restart') < 0;
                        breakBtn.hidden = ui.secondary.indexOf('break') < 0;
                        stopBtn.hidden = ui.secondary.indexOf('stop') < 0;
                        stopBtn.textContent = status.state === 'WaitingConfirmEndOfBreak' ? 'Back to presets' : 'Stop';
                        restartBtn.disabled = breakBtn.disabled = stopBtn.disabled = busy;

                        sessionCount.textContent = 'Cycles completed: ' + status.cycles;
                    } else {
                        primaryBtn.disabled = true;
                    }

                    var text = notice;
                    if (switchedOff) {
                        text = 'The device is switched off. Press its knob to switch it back on; this page reconnects by itself.';
                    } else if (!connected) {
                        if (status) {
                            text = 'Connection lost, reconnecting… (the countdown keeps running)';
                        } else if (isLocalDev && deviceHost === location.hostname) {
                            text = 'Local copy: open this page with ?device=<device-ip> to connect.';
                        } else {
                            text = 'Connecting to ' + deviceHost + '…';
                        }
                    } else if (pending) {
                        text = 'Waiting for the device…';
                    } else if (!status) {
                        // The device only sends status once it's past its boot splash screen.
                        text = 'Connected. Waiting for the device to finish starting up…';
                    }
                    connectionStatus.textContent = text;
                    connectionStatus.classList.toggle('is-warning', switchedOff || !connected || text === notice && notice !== '');

                    renderTime();
                }

                primaryBtn.addEventListener('click', function () {
                    var ui = status && STATES[status.state];
                    if (ui) send({ cmd: ui.primary[1] });
                });
                restartBtn.addEventListener('click', function () {
                    send({ cmd: 'restart' });
                });
                breakBtn.addEventListener('click', function () {
                    send({ cmd: 'break' });
                });
                stopBtn.addEventListener('click', function () {
                    send({ cmd: 'stop' });
                });

                function handleMessage(message) {
                    if (message.type === 'presets') {
                        presets = message.presets;
                        renderTabs();
                    } else if (message.type === 'status') {
                        status = message;
                        statusReceivedAt = Date.now();
                        if (message.deviceTime !== null && message.deviceTime !== undefined) {
                            clockOffset = message.deviceTime - statusReceivedAt;
                        }
                        // A command has taken effect once the state or selected preset changes, or,
                        // for restart (same state and preset), once endsAt jumps.
                        var endsAtMoved = message.endsAt !== null && pending && pending.endsAt !== null && Math.abs(message.endsAt - pending.endsAt) > 1500;
                        if (pending && (message.state !== pending.state || message.presetIndex !== pending.presetIndex || endsAtMoved)) {
                            clearTimeout(pending.timer);
                            pending = null;
                        }
                    } else if (message.type === 'shutdown') {
                        // Nothing is counting down any more: drop the last status, so the page
                        // doesn't keep a countdown running for a device that's off.
                        switchedOff = true;
                        status = null;
                        phaseLabel.textContent = 'Switched off';
                        timeDisplay.textContent = '--:--';
                        progressBar.style.width = '0%';
                        document.title = 'Pomodoro';
                    } else if (message.type === 'error') {
                        clearTimeout(pending && pending.timer);
                        pending = null;
                        notice = message.error === 'not ready' ? 'The device is still starting up. Try again in a few seconds.' : 'Device error: ' + message.error;
                    }
                    render();
                }

                function initWebSocket() {
                    websocket = new WebSocket(gateway);

                    websocket.onopen = function () {
                        connected = true;
                        switchedOff = false;
                        reconnectDelay = 1000;
                        notice = '';
                        render();
                    };

                    websocket.onmessage = function (event) {
                        handleMessage(JSON.parse(event.data));
                    };

                    // onclose also fires after a connection error (the WebSocket spec always follows
                    // an error with a close), so reconnecting here alone covers both cases. Backing
                    // off geometrically avoids hammering the device while it's rebooting (e.g. after
                    // a WiFi settings save) or unreachable.
                    websocket.onclose = function () {
                        connected = false;
                        clearTimeout(pending && pending.timer);
                        pending = null;
                        render();
                        setTimeout(initWebSocket, reconnectDelay);
                        reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_DELAY_MAX);
                    };
                }

                // The countdown runs locally from endsAt between (and without) device messages.
                setInterval(renderTime, 250);
                initWebSocket();
                render();
            })();
        </script>
    </body>
</html>
